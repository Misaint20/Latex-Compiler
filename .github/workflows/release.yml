name: release

# Builds the distributable artifacts on version tags: MSI+ZIP on Windows,
# signed DMG on macOS. The heavy installs (VS, WiX, Xcode) are preinstalled
# on GitHub runners, so this stays lean.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual runs for testing the pipeline itself

permissions:
  contents: write # needed for the softprops release step

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A plain pwsh step does NOT see MSVC: without this, cmake fails with
      # "No CMAKE_CXX_COMPILER could be found". It loads the VS dev prompt
      # environment for every later step of the job.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # WiX v3.14 provides the MSI generator (the ZIP needs no WiX).
      - name: Install WiX Toolset v3.14
        run: |
          $installer = "$env:TEMP\wix314.exe"
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3142rtm/wix314.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/quiet' -Wait
          "WIX=$env:ProgramFiles(x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Optional: only when the WINDOWS_PFX_BASE64 (and password) secrets
      # exist. Imports the code-signing certificate into the user store so
      # the packaging script can find it by thumbprint; without the secrets
      # the job ships unsigned artifacts.
      - name: Import code-signing certificate
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) {
            Write-Host 'No WINDOWS_PFX_BASE64 secret set; shipping UNSIGNED artifacts.'
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $password = if ($env:WINDOWS_PFX_PASSWORD) { ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force } else { [securestring]::new() }
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item $pfxPath

      - name: Build and package (MSI + ZIP)
        shell: pwsh
        run: |
          $signArgs = @()
          if ($env:WINDOWS_CERT_THUMBPRINT) { $signArgs += @('-CertificateThumbprint', $env:WINDOWS_CERT_THUMBPRINT) }
          pwsh -ExecutionPolicy Bypass -File scripts/package_windows.ps1 @signArgs

      - name: Run tests
        shell: pwsh
        run: |
          & "build/release/core-tests.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and package (DMG)
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release
          # Run the test suite once on the release build too.
          (cd build/release && ./core-tests)
          ./scripts/package_dmg.sh --skip-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # webview builds against webkit2gtk-4.1; fuse lets AppImages
      # (linuxdeploy itself) run on the runner, which ships without it.
      # Ubuntu 24.04 renamed libfuse2 -> libfuse2t64; try both.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      # Optional: only when the GPG_PRIVATE_KEY secret exists. The import
      # exports the key id into GITHUB_ENV, which turns on AppImage signing
      # in the packaging script; without the secret it ships unsigned.
      - name: Import GPG release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            KEYID="$(gpg --list-secret-keys --keyid-format long --with-colons | awk -F: '/^sec/{print $5; exit}')"
            echo "GPG_KEY=$KEYID" >> "$GITHUB_ENV"
          fi

      - name: Build and package (AppImage)
        run: |
          set -euo pipefail
          ./scripts/package_appimage.sh

      - name: Run tests
        run: |
          (cd build/release && ./core-tests)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
